name: Phase 1 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase1:
    name: Validate Phase 1 deliverables
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Carlito font (metric-compatible with Calibri used for the PDFs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-crosextra-carlito

      - name: Install build/test dependencies
        run: python -m pip install -r requirements.txt

      - name: Confirm rebuild font
        working-directory: 01_Project_Documentation/phase1/build
        run: python -c "import doc_common, sys; print('font:', doc_common.FONT_FAMILY); sys.exit(doc_common.FONT_FAMILY != 'Carlito')"

      - name: Guard - raw dataset and secrets are not committed
        run: |
          bad=$(git ls-files | grep -E '^02_Data/raw_data/.+\.csv$|(^|/)\.env$|kaggle\.json$|(^|/)CLAUDE\.md$' || true)
          if [ -n "$bad" ]; then echo "Files that must not be committed:"; echo "$bad"; exit 1; fi

      - name: Phase 1 validation suite (model, documents, diagram, dictionary, team details)
        working-directory: 01_Project_Documentation/phase1/build
        run: python validate_phase1.py

      - name: Unit, structure and rebuild-consistency tests
        run: python -m unittest discover -s tests -v

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-validation-report
          path: 01_Project_Documentation/phase1/build/validation_report.md
